<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Register — Pasugarram</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="app-body">
    <div class="auth-page-wrapper">
        <div class="auth-card-panel">
            <div class="auth-header">
                <a href="index.html" style="text-decoration: none;">
                    <h1 class="auth-logo-title">Pasugarram</h1>
                    <span class="brand-tagline">Freshly Yours, Farm-to-Table</span>
                </a>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab-btn active" id="tabSignIn" onclick="switchAuthTab('signin')">Sign In</button>
                <button class="auth-tab-btn" id="tabSignUp" onclick="switchAuthTab('signup')">Create Account</button>
            </div>

            <!-- Sign In Form -->
            <form id="signInForm" onsubmit="handleAuthSubmit(event, 'signin')">
                <div class="form-field-group" style="margin-bottom: 14px;">
                    <label>Email or Mobile Number</label>
                    <input type="text" required class="form-field-input" placeholder="e.g. kannan@example.com">
                </div>
                <div class="form-field-group" style="margin-bottom: 14px;">
                    <label>Password</label>
                    <input type="password" required class="form-field-input" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-auth-submit">Sign In to Pasugarram</button>
            </form>

            <!-- Sign Up Form -->
            <form id="signUpForm" style="display: none;" onsubmit="handleAuthSubmit(event, 'signup')">
                <div class="form-field-group" style="margin-bottom: 12px;">
                    <label>Full Name</label>
                    <input type="text" required class="form-field-input" placeholder="e.g. Kannan G">
                </div>
                <div class="form-field-group" style="margin-bottom: 12px;">
                    <label>Mobile Number</label>
                    <input type="tel" required class="form-field-input" placeholder="+91 98765 43210">
                </div>
                <div class="form-field-group" style="margin-bottom: 12px;">
                    <label>Email Address</label>
                    <input type="email" required class="form-field-input" placeholder="you@example.com">
                </div>
                <div class="form-field-group" style="margin-bottom: 14px;">
                    <label>Create Password</label>
                    <input type="password" required class="form-field-input" placeholder="At least 6 characters">
                </div>
                <button type="submit" class="btn-auth-submit">Create My Account</button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-sub);">
                By continuing, you agree to Pasugarram's <a href="terms&conditions.html" style="color: var(--gold-primary);">Terms of Service</a> & <a href="policy.html" style="color: var(--gold-primary);">Privacy Policy</a>.
            </div>

            <div style="text-align: center; margin-top: 14px;">
                <a href="index.html" style="color: var(--text-muted); font-size: 13px; text-decoration: none;">
                    <i class="fa-solid fa-arrow-left"></i> Return to Farm Store
                </a>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
    <script>
        function switchAuthTab(type) {
            const tabIn = document.getElementById('tabSignIn');
            const tabUp = document.getElementById('tabSignUp');
            const formIn = document.getElementById('signInForm');
            const formUp = document.getElementById('signUpForm');

            if (type === 'signin') {
                tabIn.classList.add('active');
                tabUp.classList.remove('active');
                formIn.style.display = 'block';
                formUp.style.display = 'none';
            } else {
                tabUp.classList.add('active');
                tabIn.classList.remove('active');
                formUp.style.display = 'block';
                formIn.style.display = 'none';
            }
        }

        function handleAuthSubmit(e, type) {
            e.preventDefault();
            showToast(type === 'signin' ? 'Signed in successfully!' : 'Account created successfully!', 'success');
            setTimeout(() => {
                window.location.href = 'profile.html';
            }, 1000);
        }
    </script>
</body>

</html>
